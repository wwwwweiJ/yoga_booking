name: CI

on:
  push:
    branches: [master, main]
  pull_request:

env:
  # Keep the toolchain fixed so fmt/clippy results are reproducible.
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all -- --check
      # Default clippy, denying warnings. (The old config also demanded
      # `clippy::pedantic`/`nursery`, which this codebase doesn't target — that
      # is why the previous job was permanently red.)
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The app serves the built SPA and `static.must_exist` is on even in the
      # test profile, so `frontend/dist` must exist before the app boots in
      # tests. Build it with pnpm (pinned via package.json's packageManager).
      - name: Build frontend
        working-directory: ./frontend
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile
          corepack pnpm build
      - name: cargo test
        run: cargo test --all-features
