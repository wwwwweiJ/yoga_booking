name: Build and push Docker image

# Builds the app image with the repo's Dockerfile and pushes it to GitHub
# Container Registry (GHCR). Koyeb (or any host) then deploys that image by URL
# — no GitHub repo access needed on the host's side.
#
# Pushing this file to main triggers the first build. You can also run it
# manually from the Actions tab (workflow_dispatch).

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # lets GITHUB_TOKEN push to GHCR under this owner
    steps:
      - uses: actions/checkout@v4

      # GHCR image references must be lowercase; the owner has an uppercase
      # letter, so lowercase the whole "owner/repo" for the tag.
      - name: Compute lowercase image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.img.outputs.name }}:latest
          # Cache layers between runs so later builds don't recompile all of Rust.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # After the fresh image is pushed, tell the host to pull and redeploy it.
      # Enable by adding a repo secret RENDER_DEPLOY_HOOK with the service's
      # Deploy Hook URL (Render: service → Settings → Deploy Hook). Without the
      # secret this step is a harmless no-op, so the build still works before
      # you've wired it up.
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            echo "Image pushed — triggering Render deploy…"
            curl -fsSL "$RENDER_DEPLOY_HOOK"
            echo "Render deploy triggered."
          else
            echo "RENDER_DEPLOY_HOOK secret not set; skipping auto-deploy."
          fi
